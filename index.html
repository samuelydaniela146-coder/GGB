<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glib boy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #111;
        }

        /* Barra de navegación */
        header {
            background-color: #111;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }

        nav a:hover {
            color: #aaa;
        }

        /* Inicio */
        .inicio {
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #111, #444);
            color: white;
        }

        .inicio h1 {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .inicio p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .boton {
            display: inline-block;
            background-color: white;
            color: black;
            padding: 14px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .boton:hover {
            background-color: #ddd;
        }

        /* Productos */
        .productos {
            padding: 60px 40px;
            text-align: center;
        }

        .productos h2 {
            font-size: 35px;
            margin-bottom: 40px;
        }

        .contenedor-productos {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .producto {
            background-color: white;
            width: 280px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .producto img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
        }

        .producto h3 {
            margin: 15px 0 8px;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .comprar {
            display: inline-block;
            background-color: #111;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        .comprar:hover {
            background-color: #333;
        }

        /* Contacto */
        .contacto {
            background-color: #111;
            color: white;
            padding: 50px;
            text-align: center;
        }

        .contacto h2 {
            margin-bottom: 15px;
        }

        /* Footer */
        footer {
            background-color: #000;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- MENÚ -->
    <header>
        <div class="logo">MI MARCA</div>

        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#productos">Productos</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>


    <!-- INICIO -->
    <section class="inicio" id="inicio">
        <div>
            <h1>GLIB BOY</h1>

            <a href="#productos" class="boton">VER COLECCIÓN</a>
        </div>
    </section>


    <!-- PRODUCTOS -->
    <section class="productos" id="productos">

        <h2>produtos</h2>

        <div class="contenedor-productos">

            <div class="producto">
                <img src="gb.png" alt="Camiseta">
                <h3>Camiseta GB</h3>
                <p class="precio">$40.000 COP</p>
                <button class="comprar" onclick="window.location.href='formulario.html'">
    Comprar
</button>
            </div> 

            <div class="producto">
                <img src="buso.png">
                <h3>buso rojo</h3>
                <p class="precio">$50.000 COP</p>
                <button class="comprar" onclick="window.location.href='formulario2.html'">comprar</button>
            </div>

            <div class="producto">
                <img src="pantanegro.png">
                <h3>Pantalón Negro</h3>
                <p class="precio">$100.000 COP</p>
                 <button class="comprar" onclick="window.location.href='formulario3.html'">comprar</button>
            </div>
            

        </div>
        

    </section>


    <!-- CONTACTO -->
    <section class="contacto" id="contacto">
        <h2>Contáctanos 3114314743</h2>
        <p>Instagram: @Glibboy</p>
        <p>WhatsApp: 3114314743 </p>
    </section>


    <!-- PIE DE PÁGINA -->
    <footer>
        <p>© 2026 GLIB BOY - Todos los derechos reservados</p>
    </footer>

</body>
</html>
