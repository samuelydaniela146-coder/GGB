<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar compra</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #111;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .formulario {
            background: white;
            color: black;

            width: 450px;
            max-width: 90%;

            padding: 35px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;

            margin-top: 25px;
            padding: 14px;

            background: #111;
            color: white;

            border: none;
            border-radius: 6px;

            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: black;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="formulario">

        <h1>Finalizar compra </h1>
        <h2 class="titulo">buso rojo</h2>

        <form action="https://formspree.io/f/mzeddeag" method="POST">
        <label>Nombre:</label>
    <input type="text" name="nombre" required>

    <label>Correo:</label>
    <input type="email" name="correo" required>



    <label>talla:</label>
    <textarea name="mensaje"></textarea>

    <label>numero de telefono:</label>
    <input type="text" name="numero" required>

    <label>donde vive:</label>
    <input type="text" name="donde vive" required>

    <button type="submit">Enviar</button>

        </form>

        <a href="estructure.html" class="volver">
            ← Volver a la tienda
        </a>

    </div>

</body>

</html>
